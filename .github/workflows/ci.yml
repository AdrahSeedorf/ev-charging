name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # A second compiler, because GCC and Clang disagree about what is worth warning
  # about. Clang caught a C++20-only lambda capture and an unused constant that GCC
  # accepted in silence.
  clang:
    name: ubuntu / clang / Debug
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DEVNET_WERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DEVNET_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Datasets regenerate reproducibly
        run: |
          python3 tools/build_datasets.py
          git diff --exit-code -- data/ \
            || (echo "::error::Generated data differs from committed data" && exit 1)

      - name: Ingest pipeline round-trips through the C++ core
        run: |
          python3 tools/fetch_real_network.py \
            --offline-fixture tests/fixtures/overpass_sample.json \
            --name fixture --out /tmp/fixture --demands 200
          ./build/evnet inspect --network /tmp/fixture
          ./build/evnet compare --network /tmp/fixture --demands /tmp/fixture/demands.csv
          python3 tools/render_map.py --network /tmp/fixture --out /tmp/maps --name fixture
          test -s /tmp/maps/fixture-map-light.svg

      - name: Committed maps are reproducible
        run: |
          ./build/evnet simulate --network data/hume --demands data/hume/demands.csv \
            --planner optimal --timeseries /tmp/humeload.csv
          python3 tools/render_map.py --network data/hume --load /tmp/humeload.csv \
            --title "Hume corridor charging network" \
            --subtitle "Sydney to Melbourne, 891 km. Load from 199 journeys under the optimal planner." \
            --out docs
          git diff --exit-code -- docs/ \
            || (echo "::error::Committed maps differ from freshly rendered ones" && exit 1)

      - name: Smoke-test the CLI
        run: |
          ./build/evnet inspect --network data/sydney
          ./build/evnet compare --network data/hume --demands data/hume/demands.csv
          ./build/evnet compare --network data/hume --demands data/hume/demands.csv --engine static
          ./build/evnet compare --network data/hume --demands data/hume/demands.csv --format csv
          ./build/evnet simulate --network data/hume --demands data/hume/demands.csv \
            --planner optimal --timeseries /tmp/load.csv --trips /tmp/trips.csv
          ./build/evnet site --network data/sydney --demands data/sydney/demands.csv --top 3
          test -s /tmp/load.csv && test -s /tmp/trips.csv
