<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="The static model's waits against the measured ones. Hume corridor, same fleet, same planners — only the congestion model differs. Log scale; the gap is the error." font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif">
